# Save this file in your profile repo at: .github/workflows/profile-3d.yml
# Regenerates the 3D contribution calendar once a day and commits it back.
# No third-party action and no extra token — it reads your public
# contribution grid from github.com and redraws assets/contrib.svg.

name: Contribution calendar

on:
  schedule:
    # 01:00 UTC daily — cron is always UTC
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Redraw the calendar
        run: python tools/build_contrib.py "${{ github.repository_owner }}" assets/contrib.svg

      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/contrib.svg
          if git commit -m "Refresh contribution calendar"; then
            git push
          fi
