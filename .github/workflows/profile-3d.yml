# Save this file in your profile repo at: .github/workflows/profile-3d.yml
# It regenerates the 3D contribution calendar once a day and commits it back.

name: 3D contribution calendar

on:
  schedule:
    # 05:30 IST — pick any time you like, cron is UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib
          if git commit -m "Refresh 3D contribution calendar"; then
            git push
          fi
